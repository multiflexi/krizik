name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # GTK ≥ 4.12, libadwaita ≥ 1.5 and the D-Bus headers (for BlueZ).
  SYSTEM_PACKAGES: libgtk-4-dev libadwaita-1-dev libdbus-1-dev pkg-config

jobs:
  test:
    name: Format, lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $SYSTEM_PACKAGES
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $SYSTEM_PACKAGES
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  metadata:
    name: Desktop file, AppStream and Flatpak sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
      - run: desktop-file-validate data/io.github.multiflexi.Krizik.desktop
      - run: appstreamcli validate --no-net data/io.github.multiflexi.Krizik.metainfo.xml
      # Dependabot's pull requests get the file regenerated by flatpak-sources.yml instead.
      - name: Check that flatpak/cargo-sources.json matches Cargo.lock
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          python3 flatpak/generate-cargo-sources.py Cargo.lock > "$RUNNER_TEMP/cargo-sources.json"
          if ! diff -q flatpak/cargo-sources.json "$RUNNER_TEMP/cargo-sources.json" >/dev/null; then
            echo "::error file=flatpak/cargo-sources.json::Out of date. Run: python3 flatpak/generate-cargo-sources.py Cargo.lock > flatpak/cargo-sources.json"
            exit 1
          fi
